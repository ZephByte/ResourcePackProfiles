name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Minecraft version from tag
        id: mc
        run: |
          MC_VERSION="${GITHUB_REF_NAME#*+}"
          BASE_VERSION=$(grep '^mod_base_version=' gradle.properties | cut -d'=' -f2)
          if [ "${GITHUB_REF_NAME}" != "${BASE_VERSION}+${MC_VERSION}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match mod_base_version '${BASE_VERSION}' in gradle.properties"
            exit 1
          fi
          if [ ! -d "versions/${MC_VERSION}" ]; then
            echo "::error::No versions/${MC_VERSION} directory for tag '${GITHUB_REF_NAME}'"
            exit 1
          fi
          echo "version=${MC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :${{ steps.mc.outputs.version }}:build

      - name: Find release jar
        id: jar
        run: |
          JAR=$(find versions/${{ steps.mc.outputs.version }}/build/libs -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar")
          echo "path=$JAR" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          CONTENT=$(awk '/^## /{if(p) exit; p=1; next} p' CHANGELOG.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: ${{ steps.jar.outputs.path }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}

      - name: Publish to Modrinth and CurseForge
        run: ./gradlew :${{ steps.mc.outputs.version }}:publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
